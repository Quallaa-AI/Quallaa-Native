appId: com.quallaa.ide
productName: Quallaa
copyright: Copyright © 2025 Quallaa AI

directories:
  output: dist
  buildResources: resources

files:
  - lib/**
  - src-gen/**
  - package.json

# Disable ASAR to fix terminal spawning issues
asar: false

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - dmg
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Temporarily disable code signing to debug terminal issue
  identity: null

dmg:
  title: Quallaa ${version}
  icon: resources/icon.icns
  background: null
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 150
      type: file
    - x: 400
      y: 150
      type: link
      path: /Applications

# Notarization (requires APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID env vars)
# Disabled for unsigned build testing
# afterSign: scripts/notarize.js

# Compression
compression: normal
